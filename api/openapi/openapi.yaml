openapi: 3.0.3
info:
  title: Takt API
  description: High-speed task tracker & personal productivity system with GTD workflows and automations.
  version: 0.1.0
servers:
  - url: /api/v1
    description: Current API v1 endpoint
  - url: http://localhost:8080/api/v1
    description: Local development backend

tags:
  - name: Health
    description: Service health and readiness checks
  - name: Auth
    description: Authentication and user onboarding
  - name: Workspaces
    description: Workspace management and membership
  - name: Projects
    description: Projects and boards organization
  - name: Tasks
    description: Quick capture, tasks management and focus
  - name: Automations
    description: Background workflows and trigger rules
  - name: Tags
    description: Workspace context tags
  - name: Attachments
    description: Task attachments and media storage
  - name: Search
    description: Workspace search and command palette

paths:
  /health:
    $ref: './paths/health.yaml'
  /auth/register:
    $ref: './paths/auth.yaml#/register'
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /auth/me:
    $ref: './paths/auth.yaml#/me'
  /tasks/inbox:
    $ref: './paths/tasks.yaml#/inbox'
  /tasks/{id}/toggle:
    $ref: './paths/tasks.yaml#/toggle'
  /tasks/{id}:
    $ref: './paths/tasks.yaml#/item'
  /workspaces/{workspace_id}/tasks/today:
    $ref: './paths/tasks.yaml#/today'
  /workspaces/{workspace_id}/tasks/{task_id}:
    $ref: './paths/tasks.yaml#/workspaceTaskItem'
  /workspaces/{workspace_id}/tasks/{task_id}/focus:
    $ref: './paths/tasks.yaml#/focus'
  /workspaces/{workspace_id}/tasks/{task_id}/subtasks:
    $ref: './paths/tasks.yaml#/subtasks'
  /workspaces/{workspace_id}/tags:
    $ref: './paths/tags.yaml#/tags'
  /workspaces/{workspace_id}/tags/{tag_id}:
    $ref: './paths/tags.yaml#/tagItem'
  /workspaces/{workspace_id}/tasks/{task_id}/tags/{tag_id}:
    $ref: './paths/tags.yaml#/taskTagItem'
  /workspaces/{workspace_id}/projects:
    $ref: './paths/projects.yaml#/projects'
  /workspaces/{workspace_id}/projects/{project_id}:
    $ref: './paths/projects.yaml#/projectItem'
  /workspaces/{workspace_id}/projects/{project_id}/boards:
    $ref: './paths/projects.yaml#/projectBoards'
  /workspaces/{workspace_id}/projects/{project_id}/boards/{board_id}:
    $ref: './paths/projects.yaml#/boardItem'
  /workspaces/{workspace_id}/boards/{board_id}/columns:
    $ref: './paths/projects.yaml#/boardColumns'
  /workspaces/{workspace_id}/boards/{board_id}/columns/{column_id}:
    $ref: './paths/projects.yaml#/columnItem'
  /workspaces/{workspace_id}/projects/{project_id}/tasks:
    $ref: './paths/projects.yaml#/projectTasks'
  /workspaces/{workspace_id}/tasks/{task_id}/move:
    $ref: './paths/projects.yaml#/moveTask'
  /workspaces:
    $ref: './paths/workspaces.yaml#/workspaces'
  /workspaces/{workspace_id}:
    $ref: './paths/workspaces.yaml#/workspaceItem'
  /workspaces/{workspace_id}/switch:
    $ref: './paths/workspaces.yaml#/switchWorkspace'
  /workspaces/{workspace_id}/members:
    $ref: './paths/workspaces.yaml#/workspaceMembers'
  /workspaces/{workspace_id}/members/{user_id}:
    $ref: './paths/workspaces.yaml#/workspaceMemberItem'
  /workspaces/{workspace_id}/invites:
    $ref: './paths/workspaces.yaml#/workspaceInvites'
  /invites/{token}:
    $ref: './paths/workspaces.yaml#/invitePreview'
  /invites/{token}/accept:
    $ref: './paths/workspaces.yaml#/acceptInvite'
  /workspaces/{workspace_id}/automations:
    $ref: './paths/automations.yaml#/automations'
  /workspaces/{workspace_id}/automations/{automation_id}:
    $ref: './paths/automations.yaml#/automationDetail'
  /workspaces/{workspace_id}/automations/{automation_id}/toggle:
    $ref: './paths/automations.yaml#/toggle'
  /workspaces/{workspace_id}/tasks/{task_id}/attachments:
    $ref: './paths/attachments.yaml#/taskAttachments'
  /workspaces/{workspace_id}/attachments/{attachment_id}/content:
    $ref: './paths/attachments.yaml#/attachmentContent'
  /workspaces/{workspace_id}/attachments/{attachment_id}:
    $ref: './paths/attachments.yaml#/attachmentItem'
  /workspaces/{workspace_id}/search:
    $ref: './paths/search.yaml#/search'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    HealthResponse:
      $ref: './schemas/health.yaml'
    ErrorResponse:
      $ref: './schemas/error.yaml'
    User:
      $ref: './schemas/user.yaml#/User'
    Workspace:
      $ref: './schemas/workspace.yaml#/Workspace'
    CreateWorkspaceRequest:
      $ref: './schemas/workspace.yaml#/CreateWorkspaceRequest'
    UpdateWorkspaceRequest:
      $ref: './schemas/workspace.yaml#/UpdateWorkspaceRequest'
    WorkspaceMember:
      $ref: './schemas/workspace.yaml#/WorkspaceMember'
    WorkspaceInvite:
      $ref: './schemas/workspace.yaml#/WorkspaceInvite'
    InvitePreview:
      $ref: './schemas/workspace.yaml#/InvitePreview'
    WorkspaceSwitchResponse:
      $ref: './schemas/workspace.yaml#/WorkspaceSwitchResponse'
    Task:
      $ref: './schemas/task.yaml#/Task'
    Tag:
      $ref: './schemas/tag.yaml#/Tag'
    CreateTagRequest:
      $ref: './schemas/tag.yaml#/CreateTagRequest'
    UpdateTagRequest:
      $ref: './schemas/tag.yaml#/UpdateTagRequest'
    UpdateTaskRequest:
      $ref: './schemas/task.yaml#/UpdateTaskRequest'
    SetFocusRequest:
      $ref: './schemas/task.yaml#/SetFocusRequest'
    Project:
      $ref: './schemas/project.yaml#/Project'
    Board:
      $ref: './schemas/project.yaml#/Board'
    Column:
      $ref: './schemas/project.yaml#/Column'
    CreateProjectRequest:
      $ref: './schemas/project.yaml#/CreateProjectRequest'
    UpdateProjectRequest:
      $ref: './schemas/project.yaml#/UpdateProjectRequest'
    CreateColumnRequest:
      $ref: './schemas/project.yaml#/CreateColumnRequest'
    UpdateColumnRequest:
      $ref: './schemas/project.yaml#/UpdateColumnRequest'
    MoveTaskRequest:
      $ref: './schemas/project.yaml#/MoveTaskRequest'
    Automation:
      $ref: './schemas/automation.yaml#/Automation'
    ToggleAutomationRequest:
      $ref: './schemas/automation.yaml#/ToggleAutomationRequest'
    RuleDefinition:
      $ref: './schemas/automation.yaml#/RuleDefinition'
    Trigger:
      $ref: './schemas/automation.yaml#/Trigger'
    Condition:
      $ref: './schemas/automation.yaml#/Condition'
    Action:
      $ref: './schemas/automation.yaml#/Action'
    CreateAutomationRequest:
      $ref: './schemas/automation.yaml#/CreateAutomationRequest'
    UpdateAutomationRequest:
      $ref: './schemas/automation.yaml#/UpdateAutomationRequest'
    Attachment:
      $ref: './schemas/attachment.yaml#/Attachment'
    SearchResponse:
      $ref: './schemas/search.yaml#/SearchResponse'
