openapi: 3.0.3
info:
  title: Takt API
  description: High-speed task tracker & personal productivity system with GTD workflows and automations.
  version: 0.1.0
servers:
  - url: /api/v1
    description: Current API v1 endpoint
  - url: http://localhost:8080/api/v1
    description: Local development backend

tags:
  - name: Health
    description: Service health and readiness checks
  - name: Auth
    description: Authentication and user onboarding
  - name: Workspaces
    description: Workspace management and membership
  - name: Projects
    description: Projects and boards organization
  - name: Tasks
    description: Quick capture, tasks management and focus
  - name: Automations
    description: Background workflows and trigger rules

paths:
  /health:
    $ref: './paths/health.yaml'
  /auth/register:
    $ref: './paths/auth.yaml#/register'
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /auth/me:
    $ref: './paths/auth.yaml#/me'
  /tasks/inbox:
    $ref: './paths/tasks.yaml#/inbox'
  /tasks/{id}/toggle:
    $ref: './paths/tasks.yaml#/toggle'
  /tasks/{id}:
    $ref: './paths/tasks.yaml#/item'
  /workspaces/{workspace_id}/projects:
    $ref: './paths/projects.yaml#/projects'
  /workspaces/{workspace_id}/projects/{project_id}:
    $ref: './paths/projects.yaml#/projectItem'
  /workspaces/{workspace_id}/projects/{project_id}/boards:
    $ref: './paths/projects.yaml#/projectBoards'
  /workspaces/{workspace_id}/boards/{board_id}/columns:
    $ref: './paths/projects.yaml#/boardColumns'
  /workspaces/{workspace_id}/boards/{board_id}/columns/{column_id}:
    $ref: './paths/projects.yaml#/columnItem'
  /workspaces/{workspace_id}/projects/{project_id}/tasks:
    $ref: './paths/projects.yaml#/projectTasks'
  /workspaces/{workspace_id}/tasks/{task_id}/move:
    $ref: './paths/projects.yaml#/moveTask'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    HealthResponse:
      $ref: './schemas/health.yaml'
    ErrorResponse:
      $ref: './schemas/error.yaml'
    User:
      $ref: './schemas/user.yaml#/User'
    Workspace:
      $ref: './schemas/workspace.yaml'
    Task:
      $ref: './schemas/task.yaml#/Task'
    Project:
      $ref: './schemas/project.yaml#/Project'
    Board:
      $ref: './schemas/project.yaml#/Board'
    Column:
      $ref: './schemas/project.yaml#/Column'
    CreateProjectRequest:
      $ref: './schemas/project.yaml#/CreateProjectRequest'
    UpdateProjectRequest:
      $ref: './schemas/project.yaml#/UpdateProjectRequest'
    CreateColumnRequest:
      $ref: './schemas/project.yaml#/CreateColumnRequest'
    UpdateColumnRequest:
      $ref: './schemas/project.yaml#/UpdateColumnRequest'
    MoveTaskRequest:
      $ref: './schemas/project.yaml#/MoveTaskRequest'
