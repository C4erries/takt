openapi: 3.0.3
info:
  title: Takt API
  description: High-speed task tracker & personal productivity system with GTD workflows and automations.
  version: 0.1.0
servers:
  - url: /api/v1
    description: Current API v1 endpoint
  - url: http://localhost:8080/api/v1
    description: Local development backend

tags:
  - name: Health
    description: Service health and readiness checks
  - name: Auth
    description: Authentication and user onboarding
  - name: Workspaces
    description: Workspace management and membership
  - name: Projects
    description: Projects and boards organization
  - name: Tasks
    description: Quick capture, tasks management and focus
  - name: Automations
    description: Background workflows and trigger rules

paths:
  /health:
    $ref: './paths/health.yaml'
  /auth/register:
    $ref: './paths/auth.yaml#/register'
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /auth/me:
    $ref: './paths/auth.yaml#/me'
  /tasks/inbox:
    $ref: './paths/tasks.yaml#/inbox'
  /tasks/{id}/toggle:
    $ref: './paths/tasks.yaml#/toggle'
  /tasks/{id}:
    $ref: './paths/tasks.yaml#/item'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    HealthResponse:
      $ref: './schemas/health.yaml'
    ErrorResponse:
      $ref: './schemas/error.yaml'
    User:
      $ref: './schemas/user.yaml#/User'
    Workspace:
      $ref: './schemas/workspace.yaml'
    Task:
      $ref: './schemas/task.yaml#/Task'
