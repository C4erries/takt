      - Tasks
    summary: Set or clear task focus order
    description: Assigns or clears the daily focus order for a task.
    operationId: setTaskFocus
    security:
      - BearerAuth: []
      - CookieAuth: []
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/task.yaml#/SetFocusRequest'
    responses:
      '200':
        description: Task focus order updated
        content:
          application/json:
            schema:
              $ref: '../schemas/task.yaml#/Task'
      '400':
        description: Invalid request data
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml'
      '404':
        description: Task not found in workspace
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml'

