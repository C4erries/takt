type: object
required:
  - status
  - version
  - database
properties:
  status:
    type: string
    example: ok
    enum:
      - ok
      - degraded
      - error
  version:
    type: string
    example: 0.1.0
  uptime_seconds:
    type: integer
    example: 3600
  database:
    type: object
    required:
      - status
    properties:
      status:
        type: string
        example: connected
        enum:
          - connected
          - disconnected

