Task:
  type: object
  required:
    - id
    - workspaceId
    - title
    - descriptionMarkdown
    - isCompleted
    - isArchived
    - priority
    - position
    - createdAt
    - updatedAt
    - completedAt
  properties:
    id:
      type: string
      format: uuid
      example: "123e4567-e89b-12d3-a456-426614174000"
    workspaceId:
      type: string
      format: uuid
      example: "123e4567-e89b-12d3-a456-426614174001"
    parentId:
      type: string
      format: uuid
      nullable: true
      example: null
    subtasksCount:
      type: integer
      example: 2
    subtasksCompletedCount:
      type: integer
      example: 0
    projectId:
      type: string
      format: uuid
      nullable: true
      example: null
    columnId:
      type: string
      format: uuid
      nullable: true
      example: null
    title:
      type: string
      example: "Нажми J и K для клавиатурного перемещения по строкам"
    descriptionMarkdown:
      type: string
      example: ""
    isCompleted:
      type: boolean
      example: false
    completedAt:
      type: string
      format: date-time
      nullable: true
      example: null
    dueDate:
      type: string
      format: date
      nullable: true
      example: null
    priority:
      type: string
      enum: [none, low, medium, high, pending, urgent]
      example: "none"
    focusOrder:
      type: integer
      nullable: true
      example: null
    position:
      type: number
      format: double
      example: 1000.0
    tags:
      type: array
      items:
        $ref: './tag.yaml#/Tag'
    isArchived:
      type: boolean
      default: false
      example: false
    archivedAt:
      type: string
      format: date-time
      nullable: true
      example: null
    createdAt:
      type: string
      format: date-time
      example: "2026-10-14T12:00:00Z"
    updatedAt:
      type: string
      format: date-time
      example: "2026-10-14T12:00:00Z"

CreateInboxTaskRequest:
  type: object
  required:
    - title
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 500
      example: "Купить чай сенча"
    descriptionMarkdown:
      type: string
      nullable: true
      example: ""
    priority:
      type: string
      enum: [none, low, medium, high, pending, urgent]
      default: "none"
      example: "none"
    dueDate:
      type: string
      format: date
      nullable: true
      example: "2026-10-15"
    parentId:
      type: string
      format: uuid
      nullable: true
      example: null

CreateTaskRequest:
  type: object
  required:
    - title
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 500
      example: "Купить чай сенча"
    descriptionMarkdown:
      type: string
      nullable: true
      example: ""
    priority:
      type: string
      enum: [none, low, medium, high, pending, urgent]
      default: "none"
      example: "none"
    dueDate:
      type: string
      format: date
      nullable: true
      example: "2026-10-15"
    parentId:
      type: string
      format: uuid
      nullable: true
      example: null

UpdateTaskRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 500
      example: "Обновленный заголовок"
    descriptionMarkdown:
      type: string
      example: "Детальное описание задачи в Markdown"
    dueDate:
      type: string
      format: date
      nullable: true
      example: "2026-10-15"
    priority:
      type: string
      enum: [none, low, medium, high, pending, urgent]
      example: "high"
    focusOrder:
      type: integer
      nullable: true
      example: 1
    projectId:
      type: string
      format: uuid
      nullable: true
      example: "a0000000-0000-0000-0000-000000000001"
    columnId:
      type: string
      format: uuid
      nullable: true
      example: "c0000000-0000-0000-0000-000000000001"
    parentId:
      type: string
      format: uuid
      nullable: true
      example: null

SetFocusRequest:
  type: object
  properties:
    focusOrder:
      type: integer
      nullable: true
      example: 1

UnarchiveTaskRequest:
  type: object
  required:
    - columnId
  properties:
    columnId:
      type: string
      format: uuid
      example: "c0000000-0000-0000-0000-000000000001"
    boardId:
      type: string
      format: uuid
      nullable: true
      example: "b0000000-0000-0000-0000-000000000001"
