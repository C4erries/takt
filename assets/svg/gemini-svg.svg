<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="100%" height="100%">
  <defs>
    <!-- Задний план: холодный глубоководный индиго -->
    <linearGradient id="stag-grad-back" x1="0.3" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#48367A" />
      <stop offset="35%" stop-color="#2E235C" />
      <stop offset="75%" stop-color="#111633" />
      <stop offset="100%" stop-color="#060D16" />
    </linearGradient>

    <!-- Ambient Occlusion (внутренняя тень в глубине куста) -->
    <radialGradient id="stag-grad-ao" cx="50%" cy="68%" r="48%">
      <stop offset="0%" stop-color="#04080E" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#090D1C" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#090D1C" stop-opacity="0" />
    </radialGradient>

    <!-- Средний план: насыщенный аметист -->
    <linearGradient id="stag-grad-mid" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#B589C6" />
      <stop offset="22%" stop-color="#6C4694" />
      <stop offset="65%" stop-color="#231942" />
      <stop offset="100%" stop-color="#080B18" />
    </linearGradient>

    <!-- Передний план: теплые розовато-персиковые вершины -> глубокий корень -->
    <linearGradient id="stag-grad-front" x1="0.3" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#E2B6CF" />
      <stop offset="18%" stop-color="#9D6B99" />
      <stop offset="58%" stop-color="#3B245B" />
      <stop offset="100%" stop-color="#0B0917" />
    </linearGradient>

    <!-- Контровой свет воды (Rim Light) -->
    <linearGradient id="stag-grad-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7E4F0" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3B245B" stop-opacity="0" />
    </linearGradient>

    <!-- Рифовое основание -->
    <linearGradient id="stag-grad-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141E2B" />
      <stop offset="100%" stop-color="#04090F" />
    </linearGradient>
  </defs>

  <!-- 1. ЗАДНИЙ СЛОЙ (Глубокие ветви в тени) -->
  <g class="coral-layer-back">
    <path d="M128,298 C122,255 96,220 74,178 C58,148 34,112 42,96 C50,80 68,108 82,138 C86,98 76,52 90,42 C104,32 112,82 110,124 C122,86 144,44 158,48 C172,52 152,102 142,144 C162,108 192,72 206,80 C218,88 188,136 172,174 C194,146 226,118 238,128 C250,138 208,186 184,226 C206,208 234,196 242,208 C250,220 202,258 178,298 Z" fill="url(#stag-grad-back)" />
    <path d="M188,298 C196,258 222,222 244,182 C262,150 288,118 298,126 C308,134 282,172 264,202 C286,182 314,164 322,176 C330,188 292,226 266,256 C284,246 306,242 310,254 C314,266 268,288 236,300 Z" fill="url(#stag-grad-back)" opacity="0.85" />
  </g>

  <!-- 2. СЛОЙ AMBIENT OCCLUSION (Мягкая тень внутри кроны и у корня) -->
  <g class="coral-layer-ao">
    <path d="M65,285 C50,230 95,155 165,150 C235,145 285,215 270,285 C255,310 90,315 65,285 Z" fill="url(#stag-grad-ao)" />
    <path d="M108,292 C98,255 125,205 168,202 C210,200 238,248 224,292 Z" fill="#04070D" opacity="0.65" />
  </g>

  <!-- 3. СРЕДНИЙ СЛОЙ (Основная масса ветвистого коралла с утолщениями на узлах) -->
  <g class="coral-layer-mid">
    <!-- Левая и центральная сложная ветвь -->
    <path d="M142,304 C132,268 104,238 82,196 C62,158 22,132 28,114 C34,96 64,124 88,158 C84,118 58,72 72,58 C86,44 108,94 114,138 C122,146 128,142 132,126 C138,84 134,26 152,24 C170,22 166,84 158,132 C162,142 170,140 178,126 C196,92 222,52 238,60 C254,68 218,120 196,162 C202,172 212,168 224,156 C246,134 278,108 290,120 C302,132 258,176 232,208 C210,236 196,268 190,304 Z" fill="url(#stag-grad-mid)" />
    <!-- Внутренние тени на развилках среднего слоя -->
    <path d="M114,138 C118,158 128,172 136,192 C130,168 126,148 132,126 C126,138 118,142 114,138 Z" fill="#120B29" opacity="0.6" />
    <path d="M158,132 C160,156 168,176 174,198 C172,172 178,152 196,162 C182,148 166,144 158,132 Z" fill="#120B29" opacity="0.6" />
  </g>

  <!-- 4. ПЕРЕДНИЙ СЛОЙ (Крупные ветви, выходящие вперед и перекрывающие центр) -->
  <g class="coral-layer-front">
    <!-- Тень, отбрасываемая передними ветвями на средний слой -->
    <path d="M148,306 C140,265 112,232 94,192 C116,212 136,238 148,210 C158,184 152,118 170,112 C188,106 184,174 180,208 C198,184 228,154 242,166 C254,178 216,222 198,256 C214,246 238,236 246,248 C254,260 208,288 188,306 Z" fill="#090614" opacity="0.55" transform="translate(-4, 6)" />

    <!-- Главная передняя ветвь -->
    <path d="M148,306 C138,272 114,244 88,212 C66,184 38,168 46,152 C54,136 82,158 106,188 C114,198 122,194 120,178 C116,144 98,104 114,94 C130,84 144,132 146,168 C148,180 156,180 160,166 C168,128 176,76 194,80 C212,84 196,142 186,182 C184,194 192,198 202,188 C222,166 252,142 264,154 C276,166 238,204 214,232 C208,240 214,246 226,240 C244,230 268,222 274,234 C280,246 238,272 212,288 C198,296 192,302 188,306 Z" fill="url(#stag-grad-front)" />

    <!-- Передний нижний отросток (дает сильное ощущение 3D-глубины у корня) -->
    <path d="M132,308 C124,288 98,268 82,254 C70,244 78,230 92,238 C108,248 126,266 138,262 C146,258 144,232 158,230 C172,228 168,258 176,266 C184,272 204,256 214,266 C224,276 194,296 182,308 Z" fill="url(#stag-grad-front)" />

    <!-- Органическое рифовое основание, уходящее в грунт -->
    <path d="M88,312 C96,294 132,288 168,290 C204,292 238,296 248,312 C220,318 116,318 88,312 Z" fill="url(#stag-grad-base)" />
  </g>

  <!-- 5. СЛОЙ ДЕТАЛИЗАЦИИ И СВЕТА (Rim Light + кратеры полипов) -->
  <g class="coral-layer-highlights">
    <!-- Контровой свет по верхним граням ветвей -->
    <path d="M152,24 C162,24 164,58 160,98 C158,64 156,34 146,30 C142,46 142,82 136,116 C138,76 138,26 152,24 Z" fill="url(#stag-grad-rim)" />
    <path d="M72,58 C82,50 98,82 108,122 C96,92 82,66 72,66 C66,78 78,108 84,138 C74,106 62,66 72,58 Z" fill="url(#stag-grad-rim)" />
    <path d="M194,80 C206,82 200,122 190,162 C194,128 198,92 188,88 C180,98 172,134 164,162 C170,124 180,78 194,80 Z" fill="url(#stag-grad-rim)" />
    <path d="M114,94 C126,88 138,122 142,158 C134,128 124,102 114,102 C108,112 116,142 118,168 C110,138 102,100 114,94 Z" fill="url(#stag-grad-rim)" />
    <path d="M238,60 C248,66 226,104 204,144 C218,112 236,76 230,68 C220,74 200,104 184,132 C202,96 226,54 238,60 Z" fill="url(#stag-grad-rim)" />

    <!-- Микро-кратеры полипов (светлое кольцо + темное устье внутри) -->
    <g opacity="0.55">
      <!-- На главной ветви -->
      <path d="M148,48 C152,48 154,54 150,58 C146,60 142,54 146,50 Z" fill="#F5D0FE" />
      <path d="M148,51 C150,51 151,54 149,56 C147,57 145,54 147,52 Z" fill="#2E1065" />

      <path d="M152,74 C156,74 158,82 153,86 C148,88 144,80 149,75 Z" fill="#F5D0FE" />
      <path d="M152,77 C154,77 155,81 152,83 C149,84 147,80 150,78 Z" fill="#2E1065" />

      <path d="M188,104 C193,104 195,112 190,116 C185,118 181,110 186,105 Z" fill="#F5D0FE" />
      <path d="M188,107 C190,107 191,111 189,113 C187,114 185,110 187,108 Z" fill="#2E1065" />

      <path d="M182,134 C186,134 188,140 184,144 C180,146 176,140 180,136 Z" fill="#F5D0FE" />
      <path d="M120,118 C124,118 126,125 122,129 C118,131 114,124 118,119 Z" fill="#F5D0FE" />
      <path d="M120,121 C122,121 123,124 121,126 C119,127 117,124 119,122 Z" fill="#2E1065" />

      <path d="M130,152 C135,152 137,160 132,164 C127,166 123,158 128,153 Z" fill="#F5D0FE" />
      <path d="M82,86 C86,86 88,93 84,97 C80,99 76,92 80,87 Z" fill="#E9D5FF" />
      <path d="M222,88 C226,88 228,95 224,99 C220,101 216,94 220,89 Z" fill="#E9D5FF" />
      <path d="M242,172 C246,172 248,179 244,183 C240,185 236,178 240,173 Z" fill="#F5D0FE" />
      <path d="M74,174 C78,174 80,181 76,185 C72,187 68,180 72,175 Z" fill="#F5D0FE" />
      <path d="M156,204 C161,204 163,212 158,216 C153,218 149,210 154,205 Z" fill="#E9D5FF" />
    </g>
  </g>
</svg>