<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <!-- Мягкие ленточные водоросли на заднем плане -->
    <linearGradient id="reef-grad-kelp-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E6B7B" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#0E3846" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#05131B" />
    </linearGradient>

    <linearGradient id="reef-grad-kelp-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38B2AC" />
      <stop offset="45%" stop-color="#155E63" />
      <stop offset="100%" stop-color="#061A23" />
    </linearGradient>

    <!-- Задние щупальца актинии (глубокий морской циан) -->
    <linearGradient id="reef-grad-tent-back" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4FD1C5" />
      <stop offset="40%" stop-color="#1D6870" />
      <stop offset="100%" stop-color="#08222B" />
    </linearGradient>

    <!-- Средние щупальца актинии (мятно-бирюзовое свечение) -->
    <linearGradient id="reef-grad-tent-mid" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#B2F5EA" />
      <stop offset="28%" stop-color="#38B2AC" />
      <stop offset="75%" stop-color="#0D3B42" />
      <stop offset="100%" stop-color="#061B22" />
    </linearGradient>

    <!-- Передние щупальца актинии (золотисто-лаймовые биолюминесцентные кончики) -->
    <linearGradient id="reef-grad-tent-front" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FEFCBF" />
      <stop offset="18%" stop-color="#F6E05E" />
      <stop offset="52%" stop-color="#4FD1C5" />
      <stop offset="100%" stop-color="#0B2E36" />
    </linearGradient>

    <!-- Тело/основание актинии (мясистая ножка) -->
    <linearGradient id="reef-grad-anemone-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B5660" />
      <stop offset="50%" stop-color="#0E313A" />
      <stop offset="100%" stop-color="#06151C" />
    </linearGradient>

    <!-- Многогранный рифовый камень (освещенная верхняя грань) -->
    <linearGradient id="reef-grad-rock-top" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1B3B4B" />
      <stop offset="45%" stop-color="#0F232F" />
      <stop offset="100%" stop-color="#061017" />
    </linearGradient>

    <!-- Теневая грань камня -->
    <linearGradient id="reef-grad-rock-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1922" />
      <stop offset="60%" stop-color="#060E14" />
      <stop offset="100%" stop-color="#03070A" />
    </linearGradient>

    <!-- Мягкое биолюминесцентное свечение вокруг актинии -->
    <radialGradient id="reef-grad-glow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#2DD4BF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07121A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. ЗАДНИЙ СЛОЙ (Ленточные водоросли и дальние щупальца актинии) -->
  <g class="coral-layer-back">
    <!-- Дальняя левая широкая водоросль -->
    <path d="M78,260 C62,212 92,162 76,108 C64,68 38,42 46,24 C54,38 84,64 96,106 C112,158 84,210 102,260 Z" fill="url(#reef-grad-kelp-back)" />
    <!-- Передняя левая извилистая водоросль -->
    <path d="M104,262 C88,220 118,176 106,128 C96,88 72,62 82,42 C92,58 118,86 126,126 C136,174 108,218 126,262 Z" fill="url(#reef-grad-kelp-front)" />
    <!-- Правая высокая водоросль позади камня -->
    <path d="M286,258 C304,208 274,154 292,98 C306,54 334,28 324,12 C312,28 284,56 272,98 C254,154 282,208 264,258 Z" fill="url(#reef-grad-kelp-front)" />
    <path d="M312,260 C328,218 304,174 318,128 C330,92 356,72 348,54 C338,68 312,92 302,128 C288,174 312,218 294,260 Z" fill="url(#reef-grad-kelp-back)" />

    <!-- Задний веер щупалец актинии (в глубокой тени) -->
    <path d="M142,168 C124,142 102,114 112,98 C122,84 144,116 156,144 C148,112 142,76 156,70 C170,64 172,106 176,138 C178,102 186,62 202,62 C218,62 210,104 206,138 C218,106 236,72 250,80 C264,88 238,124 224,152 C242,128 268,106 278,118 C288,130 254,154 234,172 Z" fill="url(#reef-grad-tent-back)" />
  </g>

  <!-- 2. СЛОЙ AMBIENT OCCLUSION (Свечение воды + глубокая тень в сердцевине актинии и под камнем) -->
  <g class="coral-layer-ao">
    <!-- Подводный ореол свечения -->
    <path d="M85,140 C85,75 305,75 305,140 C305,205 85,205 85,140 Z" fill="url(#reef-grad-glow)" />
    <!-- Глубокая тень внутри чаши щупалец -->
    <path d="M134,176 C126,152 156,134 196,134 C236,134 264,152 254,176 C244,194 144,194 134,176 Z" fill="#040D12" opacity="0.82" />
  </g>

  <!-- 3. СРЕДНИЙ СЛОЙ (Пышная корона средних щупалец + мясистое основание актинии) -->
  <g class="coral-layer-mid">
    <!-- Средний ряд изогнутых щупалец с каплевидными утолщениями на концах -->
    <path d="M136,178 C114,158 84,138 92,120 C100,104 128,132 148,158 C134,128 118,92 134,82 C150,72 160,114 168,148 C164,112 164,68 182,66 C200,64 194,110 192,146 C200,112 214,70 232,76 C250,82 226,124 214,154 C232,128 258,98 272,110 C286,122 248,152 228,172 C248,156 278,142 286,156 C294,170 252,182 230,186 Z" fill="url(#reef-grad-tent-mid)" />
    <!-- Левый боковой пучок средних щупалец -->
    <path d="M146,184 C122,174 92,164 96,148 C100,134 128,152 152,168 Z" fill="url(#reef-grad-tent-mid)" />
  </g>

  <!-- 4. ПЕРЕДНИЙ СЛОЙ (Передние светящиеся щупальца, ножка актинии и многогранный рифовый уступ) -->
  <g class="coral-layer-front">
    <!-- Передний каскад щупалец, нависающий вперед -->
    <path d="M144,186 C126,172 104,156 114,142 C124,128 144,152 158,170 C148,144 138,110 154,102 C170,94 174,134 178,164 C180,132 186,92 204,94 C222,96 208,136 202,166 C214,140 234,108 248,118 C262,128 234,158 218,176 C236,162 262,148 268,162 C274,176 238,186 218,190 Z" fill="url(#reef-grad-tent-front)" />

    <!-- Мясистая складчатая ножка актинии (перекрывает нижнюю часть щупалец) -->
    <path d="M138,180 C156,170 176,174 196,174 C216,174 234,168 250,178 C258,194 252,214 242,224 C216,232 172,232 146,224 C136,214 132,194 138,180 Z" fill="url(#reef-grad-anemone-base)" />
    <!-- Тень под ножкой актинии на камне -->
    <path d="M136,222 C156,214 232,214 252,222 C242,234 146,234 136,222 Z" fill="#03080C" opacity="0.85" />

    <!-- МНОГОГРАННЫЙ РИФОВЫЙ КАМЕНЬ (Сложная скальная порода) -->
    <!-- Основной темный массив скалы -->
    <path d="M24,274 C32,244 58,218 92,208 C122,198 156,212 194,210 C232,208 268,196 302,208 C336,220 364,244 376,274 C312,282 88,282 24,274 Z" fill="url(#reef-grad-rock-side)" />
    <!-- Верхние освещенные каменные плато и уступы -->
    <path d="M58,242 C72,220 104,206 142,212 C178,218 216,216 252,208 C286,200 322,214 342,236 C312,228 282,226 248,234 C212,242 174,238 136,232 C98,226 74,234 58,242 Z" fill="url(#reef-grad-rock-top)" />
    <!-- Передний острый каменный гребень -->
    <path d="M96,274 C112,250 148,236 192,238 C236,240 278,252 298,274 C248,278 146,278 96,274 Z" fill="url(#reef-grad-rock-top)" opacity="0.7" />
  </g>

  <!-- 5. СЛОЙ ДЕТАЛИЗАЦИИ И СВЕТА (Прожилки водорослей, световые грани скалы и биолюминесцентные споры) -->
  <g class="coral-layer-highlights">
    <!-- Центральные светящиеся прожилки на водорослях -->
    <path d="M114,258 C98,216 126,172 114,126 C104,90 86,66 84,48 C90,68 108,92 118,128 C128,172 102,216 118,258 Z" fill="#81E6D9" opacity="0.4" />
    <path d="M274,254 C292,206 264,152 282,98 C294,58 318,34 322,18 C312,36 290,60 278,98 C260,152 288,206 270,254 Z" fill="#81E6D9" opacity="0.4" />

    <!-- Световые блики на кончиках щупалец актинии -->
    <g fill="#FFFFF0" opacity="0.75">
      <path d="M180,68 C186,68 188,78 182,82 C176,84 174,72 180,68 Z" />
      <path d="M230,78 C236,78 236,88 230,92 C224,94 224,82 230,78 Z" />
      <path d="M134,84 C140,84 142,94 136,98 C130,100 128,88 134,84 Z" />
      <path d="M202,96 C208,96 208,106 202,110 C196,112 196,100 202,96 Z" />
      <path d="M154,104 C160,104 162,114 156,118 C150,120 148,108 154,104 Z" />
      <path d="M246,118 C252,118 250,128 244,130 C238,132 240,120 246,118 Z" />
      <path d="M114,142 C120,142 122,150 116,154 C110,156 108,146 114,142 Z" />
    </g>

    <!-- Складки на ножке актинии (поймавшие верхний свет) -->
    <path d="M162,178 C158,194 160,210 166,222 C164,210 164,194 168,178 Z" fill="#4FD1C5" opacity="0.25" />
    <path d="M196,178 C194,194 194,210 196,224 C200,210 200,194 202,178 Z" fill="#4FD1C5" opacity="0.3" />
    <path d="M228,178 C232,194 228,210 222,222 C232,210 236,194 234,178 Z" fill="#4FD1C5" opacity="0.25" />

    <!-- Контровой свет (Rim Light) по острым граням рифового камня -->
    <path d="M64,234 C84,214 114,208 146,214 C178,220 214,218 250,210 C282,202 314,212 336,230 C312,216 282,208 250,216 C214,224 178,226 146,220 C114,214 86,220 64,234 Z" fill="#5EEAD4" opacity="0.28" />
    <path d="M112,262 C134,244 162,238 194,240 C226,242 258,250 280,264 C256,254 226,246 194,244 C162,242 136,248 112,262 Z" fill="#5EEAD4" opacity="0.2" />
  </g>
</svg>