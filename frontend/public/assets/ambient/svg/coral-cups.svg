<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" width="100%" height="100%">
  <defs>
    <!-- Задние трубки в глубокой тени -->
    <linearGradient id="tube-grad-back" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#7A2846" />
      <stop offset="40%" stop-color="#451226" />
      <stop offset="80%" stop-color="#1E0712" />
      <stop offset="100%" stop-color="#070B12" />
    </linearGradient>

    <!-- Средние крупные трубки-бочонки -->
    <linearGradient id="tube-grad-mid" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#E07A86" />
      <stop offset="28%" stop-color="#A8384B" />
      <stop offset="68%" stop-color="#591527" />
      <stop offset="100%" stop-color="#14060D" />
    </linearGradient>

    <!-- Передние трубки: теплый терракотово-персиковый верх -> винная тень -->
    <linearGradient id="tube-grad-front" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F2B8B5" />
      <stop offset="22%" stop-color="#C85A68" />
      <stop offset="62%" stop-color="#6E1D35" />
      <stop offset="100%" stop-color="#1A0812" />
    </linearGradient>

    <!-- Верхний освещенный ободок устья (Rim) -->
    <linearGradient id="tube-grad-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="55%" stop-color="#E58592" />
      <stop offset="100%" stop-color="#7D243B" />
    </linearGradient>

    <!-- Внутренняя глубокая воронка трубки -->
    <radialGradient id="tube-grad-cavity" cx="50%" cy="58%" r="52%">
      <stop offset="0%" stop-color="#0A0206" />
      <stop offset="55%" stop-color="#290714" />
      <stop offset="88%" stop-color="#5C162E" />
      <stop offset="100%" stop-color="#8C2D4B" />
    </radialGradient>

    <!-- Тень между трубками -->
    <radialGradient id="tube-grad-ao" cx="50%" cy="65%" r="48%">
      <stop offset="0%" stop-color="#050205" stop-opacity="0.92" />
      <stop offset="65%" stop-color="#12050D" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#12050D" stop-opacity="0" />
    </radialGradient>

    <!-- Каменный риф под губками -->
    <linearGradient id="tube-grad-rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16222F" />
      <stop offset="50%" stop-color="#0B131C" />
      <stop offset="100%" stop-color="#04080C" />
    </linearGradient>
  </defs>

  <!-- 1. ЗАДНИЙ СЛОЙ (2 темные изогнутые трубки второго плана) -->
  <g class="coral-layer-back">
    <!-- Задняя левая высокая трубка -->
    <path d="M108,245 C92,195 76,125 88,78 C102,68 142,66 156,76 C164,122 154,192 146,245 Z" fill="url(#tube-grad-back)" />
    <path d="M88,78 C86,68 106,62 124,62 C142,62 158,68 156,76 C154,84 138,88 120,88 C102,88 90,84 88,78 Z" fill="#7A2846" />
    <path d="M95,77 C94,71 108,67 123,67 C138,67 150,71 149,76 C148,81 135,84 121,84 C107,84 96,81 95,77 Z" fill="url(#tube-grad-cavity)" />

    <!-- Задняя правая наклонная трубка -->
    <path d="M214,252 C222,202 246,138 268,96 C282,92 316,102 324,116 C308,158 282,212 262,252 Z" fill="url(#tube-grad-back)" />
    <path d="M268,96 C272,88 288,88 304,94 C318,100 328,110 324,116 C320,122 302,120 288,114 C274,108 264,102 268,96 Z" fill="#7A2846" />
    <path d="M274,98 C277,93 290,93 302,98 C313,103 320,110 317,114 C314,118 300,116 289,112 C278,107 271,102 274,98 Z" fill="url(#tube-grad-cavity)" />
  </g>

  <!-- 2. СЛОЙ AMBIENT OCCLUSION (Глубокие тени в пучке между трубками) -->
  <g class="coral-layer-ao">
    <path d="M62,265 C48,205 102,135 192,135 C282,135 328,205 312,265 C296,295 78,295 62,265 Z" fill="url(#tube-grad-ao)" />
  </g>

  <!-- 3. СРЕДНИЙ СЛОЙ (3 крупные бочкообразные изогнутые губки) -->
  <g class="coral-layer-mid">
    <!-- Средняя левая пузатая трубка, наклоненная влево -->
    <path d="M98,268 C72,232 34,178 36,128 C38,116 78,102 98,108 C116,148 128,212 138,265 Z" fill="url(#tube-grad-mid)" />
    <!-- Ребра и складки на левой трубке -->
    <path d="M52,126 C48,168 68,218 96,262 C74,218 58,168 62,124 Z" fill="#2A0713" opacity="0.45" />
    <path d="M76,118 C74,162 92,212 114,258 C98,212 84,162 86,116 Z" fill="#2A0713" opacity="0.4" />
    <!-- Устье левой трубки -->
    <path d="M36,128 C32,118 48,106 68,102 C86,98 102,102 98,112 C94,122 78,128 58,132 C42,134 38,134 36,128 Z" fill="url(#tube-grad-rim)" />
    <path d="M43,125 C40,118 52,110 67,107 C82,104 93,107 90,114 C87,120 74,125 60,127 C48,129 45,129 43,125 Z" fill="url(#tube-grad-cavity)" />

    <!-- Центральная доминирующая высокая бочка -->
    <path d="M138,272 C122,218 116,136 134,82 C152,72 204,72 222,84 C236,138 226,218 206,272 Z" fill="url(#tube-grad-mid)" />
    <!-- Органические продольные впадины между ребрами -->
    <path d="M152,92 C142,148 144,212 156,268 C150,212 152,148 162,92 Z" fill="#2A0713" opacity="0.5" />
    <path d="M184,94 C180,152 178,214 176,268 C186,214 190,152 194,94 Z" fill="#2A0713" opacity="0.45" />
    <path d="M208,90 C214,146 208,210 194,266 C214,210 222,146 216,90 Z" fill="#2A0713" opacity="0.5" />
    <!-- Устье центральной бочки -->
    <path d="M134,82 C132,68 156,60 180,60 C204,60 224,70 222,84 C220,96 198,104 176,104 C152,104 136,94 134,82 Z" fill="url(#tube-grad-rim)" />
    <path d="M143,81 C142,71 160,65 179,65 C198,65 214,72 212,82 C210,91 193,97 176,97 C157,97 145,90 143,81 Z" fill="url(#tube-grad-cavity)" />

    <!-- Средняя правая изогнутая трубка -->
    <path d="M204,270 C216,222 238,164 234,126 C248,116 292,120 304,134 C308,176 282,232 254,270 Z" fill="url(#tube-grad-mid)" />
    <path d="M254,136 C256,178 242,226 224,266 C248,226 264,178 264,138 Z" fill="#2A0713" opacity="0.45" />
    <path d="M282,140 C286,182 268,228 244,266 C274,228 294,182 290,140 Z" fill="#2A0713" opacity="0.45" />
    <!-- Устье правой трубки -->
    <path d="M234,126 C234,114 254,110 274,114 C294,118 308,126 304,136 C300,146 280,148 262,144 C244,140 234,134 234,126 Z" fill="url(#tube-grad-rim)" />
    <path d="M242,126 C242,118 258,115 273,118 C288,121 299,127 296,134 C293,141 278,142 264,139 C250,136 242,132 242,126 Z" fill="url(#tube-grad-cavity)" />
  </g>

  <!-- 4. ПЕРЕДНИЙ СЛОЙ (2 короткие широкие губки на переднем плане, перекрывающие основания задних + риф) -->
  <g class="coral-layer-front">
    <!-- Падающая тень от передних трубок назад -->
    <path d="M88,278 C78,232 82,174 102,158 C134,152 178,162 192,182 C214,168 252,172 266,188 C278,214 264,256 248,278 Z" fill="#070205" opacity="0.65" transform="translate(0, -6)" />

    <!-- Передняя левая-центральная широкая чаша-трубка -->
    <path d="M104,282 C86,246 84,192 98,158 C116,146 168,148 184,162 C194,196 184,248 168,282 Z" fill="url(#tube-grad-front)" />
    <!-- Ребра объема передней трубки -->
    <path d="M116,172 C108,208 112,248 122,278 C118,246 116,208 124,174 Z" fill="#3D0B1E" opacity="0.5" />
    <path d="M146,174 C142,210 142,248 144,278 C150,248 152,210 154,174 Z" fill="#3D0B1E" opacity="0.45" />
    <path d="M168,170 C172,206 166,246 156,278 C172,246 180,206 176,170 Z" fill="#3D0B1E" opacity="0.5" />
    <!-- Устье передней трубки -->
    <path d="M98,158 C96,144 120,136 144,138 C168,140 188,150 184,162 C180,174 158,180 136,178 C112,176 100,168 98,158 Z" fill="url(#tube-grad-rim)" />
    <path d="M107,157 C106,147 124,141 143,143 C162,144 177,151 175,160 C172,169 155,173 137,172 C118,170 108,164 107,157 Z" fill="url(#tube-grad-cavity)" />

    <!-- Передняя правая низкая молодая губка -->
    <path d="M178,284 C174,254 182,212 196,190 C212,182 252,186 264,198 C270,224 254,260 236,284 Z" fill="url(#tube-grad-front)" />
    <path d="M212,204 C206,232 204,260 206,282 C212,260 216,232 220,206 Z" fill="#3D0B1E" opacity="0.5" />
    <path d="M240,206 C242,234 234,260 224,282 C240,260 250,234 248,206 Z" fill="#3D0B1E" opacity="0.5" />
    <path d="M196,190 C196,180 214,174 234,178 C252,182 266,190 264,198 C260,208 242,212 224,208 C206,204 196,198 196,190 Z" fill="url(#tube-grad-rim)" />
    <path d="M204,190 C204,183 218,179 233,182 C247,185 257,191 255,197 C252,204 239,206 225,203 C211,200 204,196 204,190 Z" fill="url(#tube-grad-cavity)" />

    <!-- Фактурное рифовое основание, объединяющее колонию -->
    <path d="M46,294 C54,274 88,264 128,268 C156,270 182,262 214,266 C252,270 292,272 308,294 C264,302 92,302 46,294 Z" fill="url(#tube-grad-rock)" />
  </g>

  <!-- 5. СЛОЙ ДЕТАЛИЗАЦИИ И СВЕТА (Световые ребра, поры губки и контровой блик) -->
  <g class="coral-layer-highlights">
    <!-- Светлые выпуклые ребра на трубках (ловят свет сверху) -->
    <path d="M140,100 C132,148 134,204 144,254 C138,204 140,148 148,102 Z" fill="#FFE4E6" opacity="0.35" />
    <path d="M168,104 C164,152 164,206 166,256 C170,206 172,152 176,104 Z" fill="#FFE4E6" opacity="0.3" />
    <path d="M198,102 C202,148 196,204 184,252 C202,204 210,148 204,100 Z" fill="#FFE4E6" opacity="0.25" />

    <path d="M104,170 C96,206 100,244 112,274 C106,244 104,206 112,172 Z" fill="#FFE4E6" opacity="0.45" />
    <path d="M130,176 C126,210 128,246 134,276 C134,246 134,210 138,176 Z" fill="#FFE4E6" opacity="0.4" />
    <path d="M158,176 C160,210 156,246 148,274 C162,246 168,210 164,174 Z" fill="#FFE4E6" opacity="0.35" />

    <path d="M198,202 C192,230 192,256 196,278 C198,256 200,230 206,204 Z" fill="#FFE4E6" opacity="0.4" />
    <path d="M226,208 C224,234 220,258 214,278 C226,258 232,234 232,208 Z" fill="#FFE4E6" opacity="0.35" />

    <!-- Органические поры-кратеры на стенках губок -->
    <g fill="#4C0519" opacity="0.45">
      <path d="M154,122 C158,122 160,127 156,130 C152,132 149,127 152,123 Z" />
      <path d="M188,134 C191,134 193,138 190,141 C187,143 184,138 187,135 Z" />
      <path d="M122,194 C126,194 128,200 124,203 C120,205 117,199 120,195 Z" />
      <path d="M148,212 C151,212 153,216 150,219 C147,221 144,216 147,213 Z" />
      <path d="M68,154 C72,154 74,159 70,162 C66,164 63,159 66,155 Z" />
      <path d="M272,164 C276,164 278,169 274,172 C270,174 267,169 270,165 Z" />
      <path d="M214,232 C218,232 220,237 216,240 C212,242 209,237 212,233 Z" />
    </g>

    <!-- Тонкие биолюминесцентные гидроиды (веточки у подножия) -->
    <path d="M72,276 C62,252 42,234 26,226 C44,238 58,254 66,276 Z" fill="#F5D0FE" opacity="0.6" />
    <path d="M60,256 C54,244 56,230 64,222 C58,232 58,244 64,256 Z" fill="#F5D0FE" opacity="0.5" />
    <path d="M278,278 C290,254 312,236 330,228 C310,240 292,256 284,278 Z" fill="#F5D0FE" opacity="0.6" />
    <path d="M294,256 C302,244 300,230 292,220 C298,232 298,244 290,256 Z" fill="#F5D0FE" opacity="0.5" />
  </g>
</svg>