<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="100%">
  <defs>
    <!-- Задние ярусы: глубокий янтарно-сливовый -->
    <linearGradient id="plate-grad-back" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#B85D52" />
      <stop offset="40%" stop-color="#6E2B32" />
      <stop offset="85%" stop-color="#28111B" />
      <stop offset="100%" stop-color="#0B0912" />
    </linearGradient>

    <!-- Средние ярусы: теплая терракота и лососевый -->
    <linearGradient id="plate-grad-mid" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#E8997E" />
      <stop offset="30%" stop-color="#B8534B" />
      <stop offset="72%" stop-color="#521D27" />
      <stop offset="100%" stop-color="#1A0B13" />
    </linearGradient>

    <!-- Передние верхние чаши: светящийся кремово-золотой край -> охра -> морской янтарь -->
    <linearGradient id="plate-grad-front" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F7DEC4" />
      <stop offset="22%" stop-color="#D97F6C" />
      <stop offset="60%" stop-color="#8A363B" />
      <stop offset="100%" stop-color="#1F1218" />
    </linearGradient>

    <!-- Падающая тень между террасами (Drop Shadow / AO) -->
    <linearGradient id="plate-grad-shadow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#080408" stop-opacity="0.88" />
      <stop offset="60%" stop-color="#170912" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#170912" stop-opacity="0" />
    </linearGradient>

    <!-- Светящаяся волнистая кромка лепестка -->
    <linearGradient id="plate-grad-lip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5D7B8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFF2E2" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F5D7B8" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- 1. ЗАДНИЙ СЛОЙ (Верхние и дальние широкие террасы) -->
  <g class="coral-layer-back">
    <!-- Левая дальняя чаша -->
    <path d="M44,168 C22,152 10,126 26,112 C42,98 66,114 84,102 C102,90 128,88 144,104 C158,118 178,108 188,122 C198,136 168,162 138,172 C104,182 66,184 44,168 Z" fill="url(#plate-grad-back)" />
    <!-- Правая дальняя чаша -->
    <path d="M156,162 C148,142 166,114 188,106 C210,98 228,114 248,102 C268,90 298,98 308,116 C318,134 298,158 272,168 C242,178 164,182 156,162 Z" fill="url(#plate-grad-back)" />
  </g>

  <!-- 2. СЛОЙ AMBIENT OCCLUSION (Глубокая тень под всей шапкой коралла и между ярусами) -->
  <g class="coral-layer-ao">
    <path d="M36,238 C18,208 58,168 170,168 C282,168 322,208 304,238 C286,256 54,256 36,238 Z" fill="url(#plate-grad-shadow)" />
    <!-- Падающая тень от среднего яруса на задний -->
    <path d="M48,156 C78,138 134,136 176,148 C218,136 268,142 292,158 C264,176 76,176 48,156 Z" fill="#090307" opacity="0.65" />
  </g>

  <!-- 3. СРЕДНИЙ СЛОЙ (Каскад из 2 широких волнистых лепестков-террас) -->
  <g class="coral-layer-mid">
    <!-- Средний левый веерный ярус -->
    <path d="M28,198 C12,182 18,156 38,146 C58,136 76,152 98,138 C120,124 152,126 170,142 C186,156 208,146 218,162 C228,178 194,206 154,214 C108,222 44,214 28,198 Z" fill="url(#plate-grad-mid)" />

    <!-- Тень от правого среднего яруса на левый (перекрытие Z) -->
    <path d="M138,208 C126,184 142,154 172,146 C202,138 228,164 218,196 C204,214 152,220 138,208 Z" fill="url(#plate-grad-shadow)" />

    <!-- Средний правый веерный ярус (перекрывает левый) -->
    <path d="M144,204 C132,184 146,156 170,146 C194,136 212,152 236,138 C260,124 294,132 312,152 C328,170 314,196 286,206 C254,218 156,224 144,204 Z" fill="url(#plate-grad-mid)" />
  </g>

  <!-- 4. ПЕРЕДНИЙ СЛОЙ (Нижние и центральные чаши, создающие 3D-каскад) -->
  <g class="coral-layer-front">
    <!-- Жесткая падающая тень под центральной верхней чашей -->
    <path d="M72,202 C64,178 96,154 156,154 C216,154 258,178 246,204 C232,226 84,226 72,202 Z" fill="url(#plate-grad-shadow)" transform="translate(0, 10)" />

    <!-- Центральная главная волнистая чаша (нависает над нижними) -->
    <path d="M76,192 C62,174 74,148 98,140 C122,132 138,148 164,136 C190,124 222,132 238,150 C252,166 244,192 216,202 C182,214 90,210 76,192 Z" fill="url(#plate-grad-front)" />

    <!-- Нижний передний левый лепесток у самого дна -->
    <path d="M46,232 C34,218 44,198 66,192 C88,186 104,198 126,188 C148,178 176,186 186,202 C196,218 172,238 142,242 C108,246 58,246 46,232 Z" fill="url(#plate-grad-front)" />

    <!-- Тень на стыке нижних лепестков -->
    <path d="M136,240 C128,220 144,198 172,194 C198,190 212,214 198,236 Z" fill="url(#plate-grad-shadow)" />

    <!-- Нижний передний правый лепесток (самый ближний к зрителю) -->
    <path d="M142,236 C132,220 146,198 170,192 C194,186 210,198 234,188 C258,178 286,188 296,206 C306,224 284,242 252,246 C216,250 152,252 142,236 Z" fill="url(#plate-grad-front)" />
  </g>

  <!-- 5. СЛОЙ ДЕТАЛИЗАЦИИ И СВЕТА (Светящиеся волнистые кромки + радиальные прожилки) -->
  <g class="coral-layer-highlights">
    <!-- Светящиеся каемки (Rim Light) по волнистому краю каждой чаши -->
    <!-- Задние кромки -->
    <path d="M26,112 C42,98 66,114 84,102 C102,90 128,88 144,104 C158,118 178,108 188,122 C176,114 156,124 142,110 C126,94 102,96 84,108 C66,120 42,104 26,118 Z" fill="url(#plate-grad-lip)" opacity="0.55" />
    <path d="M188,106 C210,98 228,114 248,102 C268,90 298,98 308,116 C296,104 268,96 248,108 C228,120 210,104 188,112 Z" fill="url(#plate-grad-lip)" opacity="0.55" />

    <!-- Средние кромки -->
    <path d="M22,162 C26,152 38,142 54,142 C68,142 82,148 98,138 C120,124 152,126 170,142 C184,154 204,146 214,158 C202,152 182,160 168,148 C150,132 120,130 98,144 C82,154 68,148 54,148 C40,148 28,156 22,162 Z" fill="url(#plate-grad-lip)" opacity="0.75" />
    <path d="M148,166 C154,154 168,142 186,142 C202,142 218,148 236,138 C260,124 294,132 312,152 C292,138 260,130 236,144 C218,154 202,148 186,148 C170,148 156,158 148,166 Z" fill="url(#plate-grad-lip)" opacity="0.75" />

    <!-- Передние главные кромки (самые яркие) -->
    <path d="M72,164 C76,150 92,136 112,138 C128,140 144,144 164,136 C190,124 222,132 238,150 C220,138 190,130 164,142 C144,150 128,146 112,144 C94,142 80,154 72,164 Z" fill="url(#plate-grad-lip)" />
    <path d="M44,210 C50,198 66,188 84,190 C100,192 112,194 126,188 C148,178 176,186 186,202 C174,192 148,184 126,194 C112,200 100,198 84,196 C68,194 52,202 44,210 Z" fill="url(#plate-grad-lip)" />
    <path d="M140,214 C146,200 164,188 184,190 C202,192 216,194 234,188 C258,178 286,188 296,206 C284,194 258,184 234,194 C216,200 202,198 184,196 C166,194 150,204 140,214 Z" fill="url(#plate-grad-lip)" />

    <!-- Тонкие радиальные бороздки-прожилки внутри чаш -->
    <g fill="#FFE4D6" opacity="0.24">
      <!-- Центральная чаша -->
      <path d="M162,144 C158,162 152,182 144,198 C154,182 162,162 166,144 Z" />
      <path d="M182,142 C184,160 182,180 176,198 C186,180 190,160 186,142 Z" />
      <path d="M204,146 C210,162 212,180 206,196 C216,180 216,162 208,146 Z" />
      <path d="M136,148 C126,164 116,180 104,194 C118,180 130,164 140,148 Z" />
      <path d="M112,148 C98,162 88,176 78,188 C90,176 102,162 116,148 Z" />

      <!-- Правая передняя чаша -->
      <path d="M232,196 C228,212 222,228 214,242 C226,228 232,212 236,196 Z" />
      <path d="M254,196 C256,212 254,228 246,242 C258,228 262,212 258,196 Z" />
      <path d="M204,200 C196,214 186,228 176,240 C190,228 200,214 208,200 Z" />

      <!-- Левая передняя чаша -->
      <path d="M124,196 C118,210 110,224 100,236 C114,224 122,210 128,196 Z" />
      <path d="M148,196 C148,210 144,224 136,236 C148,224 154,210 152,196 Z" />
      <path d="M96,200 C86,212 76,224 66,234 C80,224 90,212 100,200 Z" />
    </g>
  </g>
</svg>