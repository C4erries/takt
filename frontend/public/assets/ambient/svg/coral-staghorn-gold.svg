<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="100%" height="100%">
  <defs>
    <!-- Deep amber shadow layer -->
    <linearGradient id="gold-grad-back" x1="0.3" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="40%" stop-color="#78350F" />
      <stop offset="80%" stop-color="#2D1104" />
      <stop offset="100%" stop-color="#0F0501" />
    </linearGradient>

    <!-- Mid sunny golden layer -->
    <linearGradient id="gold-grad-mid" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="65%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Front glowing lemon-gold layer -->
    <linearGradient id="gold-grad-front" x1="0.3" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="22%" stop-color="#FACC15" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Golden glow rim -->
    <linearGradient id="gold-grad-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FDE047" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. BACK BRANCHES -->
  <g class="coral-layer-back">
    <path d="M135,300 C130,250 102,215 80,172 C62,142 36,108 45,92 C54,76 72,105 88,135 C92,92 82,48 98,38 C112,28 120,78 118,120 C130,82 152,38 168,44 C182,48 160,98 150,140 C170,105 200,68 214,75 C226,82 195,132 180,170 C202,142 235,112 248,122 C260,132 216,182 192,222 C214,202 242,192 250,205 C258,218 210,255 185,300 Z" fill="url(#gold-grad-back)" />
  </g>

  <!-- 2. MID BRANCHES -->
  <g class="coral-layer-mid">
    <path d="M145,300 C140,255 118,225 102,185 C88,155 68,125 78,112 C88,98 102,125 112,152 C120,115 112,72 125,65 C138,58 142,102 142,138 C155,102 175,65 188,70 C202,75 185,118 175,152 C195,122 222,95 235,105 C248,115 220,158 200,195 C220,178 245,170 252,182 C258,195 218,235 195,300 Z" fill="url(#gold-grad-mid)" />
  </g>

  <!-- 3. FRONT BRANCHES & HIGHLIGHTS -->
  <g class="coral-layer-front">
    <path d="M152,300 C148,260 132,235 120,202 C108,175 92,148 102,138 C112,128 122,148 130,172 C138,138 132,102 144,98 C155,92 158,128 158,158 C170,128 188,98 198,102 C208,108 195,142 188,170 C205,145 228,125 238,135 C248,145 225,182 208,215 C224,202 245,195 250,205 C255,215 222,250 205,300 Z" fill="url(#gold-grad-front)" />
    <!-- Glowing branch tips -->
    <circle cx="78" cy="112" r="5" fill="url(#gold-grad-rim)" />
    <circle cx="125" cy="65" r="6" fill="url(#gold-grad-rim)" />
    <circle cx="188" cy="70" r="6" fill="url(#gold-grad-rim)" />
    <circle cx="235" cy="105" r="5" fill="url(#gold-grad-rim)" />
  </g>
</svg>
