<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="100%" height="100%">
  <defs>
    <!-- Градиент дальних стеблей (глубокая тень) -->
    <linearGradient id="kelp-back-grad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#0E5A63" />
      <stop offset="100%" stop-color="#041A22" />
    </linearGradient>

    <!-- Градиент средних стеблей -->
    <linearGradient id="kelp-mid-grad" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="35%" stop-color="#14B8A6" />
      <stop offset="75%" stop-color="#0D4B52" />
      <stop offset="100%" stop-color="#051921" />
    </linearGradient>

    <!-- Градиент передних стеблей (самые яркие и сочные) -->
    <linearGradient id="kelp-front-grad" x1="0.3" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#99F6E4" />
      <stop offset="25%" stop-color="#2DD4BF" />
      <stop offset="65%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
  </defs>

  <!-- СЛОЙ 1: ЗАДНИЕ СТЕБЛИ -->
  <g class="kelp-layer-back">
    <path d="M185,295 C205,235 220,185 208,135 C196,85 165,55 182,32 C188,48 212,82 222,125 C232,168 218,218 198,295 Z" fill="url(#kelp-back-grad)" />
    <path d="M152,295 C132,238 112,185 125,132 C138,79 175,52 162,28 C152,45 122,82 110,132 C98,182 122,232 142,295 Z" fill="url(#kelp-back-grad)" />
  </g>

  <!-- СЛОЙ 2: СРЕДНИЕ СТЕБЛИ -->
  <g class="kelp-layer-mid">
    <path d="M168,295 C155,230 185,170 165,110 C145,50 178,25 166,8 C158,25 125,75 148,135 C172,195 145,245 162,295 Z" fill="url(#kelp-mid-grad)" />
    <path d="M192,295 C215,240 235,190 215,142 C195,94 155,75 172,48 C185,68 215,108 232,152 C248,195 222,242 188,295 Z" fill="url(#kelp-mid-grad)" />
  </g>

  <!-- СЛОЙ 3: ПЕРЕДНИЕ СТЕБЛИ -->
  <g class="kelp-layer-front">
    <path d="M138,295 C108,245 88,195 112,148 C136,102 112,72 92,52 C102,72 138,102 125,152 C112,202 152,248 152,295 Z" fill="url(#kelp-front-grad)" />
    <path d="M182,295 C195,250 175,200 195,155 C215,110 242,85 228,62 C218,82 182,125 168,168 C155,210 175,255 175,295 Z" fill="url(#kelp-front-grad)" />
  </g>
</svg>

